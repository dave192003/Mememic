
name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🎉 Welcome to MemeMic!

            Thank you for opening your first issue. We appreciate your contribution!
            Please provide any additional details that can help us understand the issue.

          pr-message: |
            🎉 Welcome to MemeMic!

            Thank you for submitting your first pull request!
            We appreciate your effort in helping improve MemeMic. 🚀
